<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- Fix 1 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Fix 2 -->

  <title>Offline</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #122259;
      color: white;
      margin: 0;
    }

    h1 {
      font-size: 2rem;
    }

    p {
      font-size: 1.2rem;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: white;
      color: #122259;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>
<body>

  <h1>📡 You're Offline</h1>
  <p>Please check your internet connection.</p>

  <button onclick="location.reload()">Try Again</button>

</body>
</html>
